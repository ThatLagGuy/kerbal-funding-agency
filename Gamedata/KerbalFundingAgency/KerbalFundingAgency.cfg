// ────────────────────────────────────────────────────────────────────────────
// Kerbal Funding Agency – Government Budget Allocation Settings
// Place at: GameData/KerbalFundingAgency/KerbalFundingAgency.cfg
//
// Annual budget formula:
//   budget = baseAllocation × reputationMultiplier × facilityMultiplier × penaltyMultiplier
//
// Year length is detected automatically from the home body's orbital period.
// Compatible with stock KSP, RSS, JNSQ, GPP, and any other planet pack.
// ────────────────────────────────────────────────────────────────────────────

KFA_SETTINGS
{
    // Mod version – do not edit manually, updated by the settings panel
    version = 0.3.0
    // ── Base allocation ──────────────────────────────────────────────────────
    // Funds deposited per year before any multipliers.
    //
    // Suggested values:
    //   Easy stock career  →  300000
    //   Normal stock       →  150000
    //   Hard stock         →   75000
    //   RP-1 / RSS         → 1500000  (RP-1 costs are in the millions)
    baseAllocation = 150000

    // ── Reputation multipliers ───────────────────────────────────────────────
    // rep = 0    → budget × minRepMultiplier
    // rep = 1000 → budget × maxRepMultiplier
    // Linear between the two.
    minRepMultiplier = 0.5
    maxRepMultiplier = 2.0

    // ── Facility multipliers ─────────────────────────────────────────────────
    // All buildings at level 0 → facilityMultiplierBase
    // All buildings fully upgraded → facilityMultiplierMax
    // Buildings tracked: VAB, R&D, Administration, Launch Pad
    facilityMultiplierBase = 1.0
    facilityMultiplierMax  = 2.5

    // ── Reputation penalty system ────────────────────────────────────────────
    // If reputation falls below repPenaltyThreshold, the government starts
    // cutting your budget allocation.
    //
    // repPenaltyThreshold:  reputation score below which penalties apply (0–1000)
    // penaltyPerYear:       fractional budget cut per consecutive low-rep year
    //                       e.g. 0.15 = 15% cut in year 1, 30% in year 2, ...
    // maxPenaltyMultiplier: floor – the multiplier never goes below this value
    //                       before the freeze kicks in (e.g. 0.6 = max 40% cut)
    // penaltyFreezeAfterYears: after this many consecutive penalty years,
    //                           funding is completely frozen for that year (×0)
    //
    // Example with defaults (threshold=200, penaltyPerYear=0.15, freeze=3):
    //   Year 1 low rep → ×0.85
    //   Year 2 low rep → ×0.70
    //   Year 3 low rep → FROZEN (×0.00) + warning message
    //   Recover rep above 200 at any point → streak resets
    repPenaltyThreshold    = 200
    penaltyPerYear         = 0.15
    maxPenaltyMultiplier   = 0.60
    penaltyFreezeAfterYears = 3

    // ── UI ───────────────────────────────────────────────────────────────────
    // Show a detailed breakdown message in the KSP message log each year.
    showBreakdown = true
}
